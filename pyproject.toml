[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merchantos-ai"
version = "0.1.0"
description = "MerchantOS AI - Phase 01: Core Contracts, Adapter & Webhook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "jinja2",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[tool.setuptools.packages.find]
where = ["apps/api", "core", "integrations/razorpay", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["apps/api", "core", "integrations/razorpay", "simulator"]
timeout = 20
filterwarnings = [
    "ignore",
]
